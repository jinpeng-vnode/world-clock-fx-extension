<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>世界时钟与汇率</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="title">世界时钟与汇率</div>
    <div id="langBox" class="lang-box" title="当前标签页语言">语言 —</div>
  </header>

  <section class="toolbar">
    <span class="toolbar-spacer"></span>
    <button type="button" id="fxRefresh" class="btn">⟳ 刷新汇率</button>
  </section>
  <p id="fxNote" class="fx-note">正在获取汇率…</p>

  <!-- 单张主卡：设置 + 时钟 + 换算；背景随日夜相位变色 -->
  <div id="mainCard" class="main-card cty clk" hidden>
    <div class="card-controls">
      <label class="field">
        <span class="field-lab">显示地区</span>
        <select id="regionSelect" class="sel">
          <option value="auto">跟随网页语言</option>
          <option value="us">纽约 · en · USD</option>
          <option value="eu">法兰克福 · 欧语 · EUR</option>
          <option value="tr">伊斯坦布尔 · tr · TRY</option>
          <option value="vn">胡志明市 · vi · VND</option>
          <option value="br">圣保罗 · pt · BRL</option>
        </select>
      </label>
      <p id="regionHint" class="hint">根据当前网页语言自动选择</p>
      <label class="field row usd-row">
        <span class="field-lab">1 USD =</span>
        <input type="number" id="usdCnyInput" class="num" min="0.01" step="0.01" value="7" />
        <span class="field-lab">CNY</span>
      </label>
    </div>

    <div id="clkMount" class="clk-mount"></div>

    <div class="convert-compact" id="convertPanel" aria-label="金额换算">
      <div class="conv-row">
        <input type="text" id="amtInput" class="amt" inputmode="decimal" value="100" autocomplete="off" aria-label="当前币种金额" />
        <span class="code" id="amtCur">USD</span>
        <span class="arr">→</span>
        <strong id="usdOut" class="out">—</strong>
        <span class="unit">USD</span>
        <span class="arr">→</span>
        <strong id="cnyOut" class="out">—</strong>
        <span class="unit">CNY</span>
      </div>
      <div class="rate-lines">
        <span id="rateUsd">1 CUR ≈ — USD</span>
        <span class="sep">·</span>
        <span id="rateCny">1 USD = — CNY</span>
      </div>
    </div>
  </div>

  <p id="noRegion" class="empty" hidden>当前网页语言无对应地区时钟，请手动选择地区。</p>

  <footer class="foot">
    只显示当前网页对应的一个地区；换网页按语言自动切换（可按站点手动覆盖）。页面本身不会被修改；金额换算仅在本弹窗内。
  </footer>

  <script src="../lib/countries.js"></script>
  <script src="../lib/format.js"></script>
  <script src="../lib/fx.js"></script>
  <script src="../lib/clock.js"></script>
  <script src="popup.js"></script>
</body>
</html>
